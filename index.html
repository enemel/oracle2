function init(firstTime){

              }

function spin(){
  

  console.log('spin!');
  
  // disable the 'Play' button
  
  /* is this not working?  */

  playButton.classList.remove('enabled');
  
  var doors = document.querySelectorAll('.door');
  
  // for each door/reel
  for (var z = 0; z < doors.length; z++) {
   
    var door = doors[z];
    
    // we move the parent container
    var boxes = door.querySelector('.boxes');
    
    // by whatever value we set in the init ('2' seconds)
    
    // boxes.style.transitionDuration += (z * 100); // does this do anything?
    var duration = parseInt(boxes.style.transitionDuration);
    
    // go all at once 
    boxes.style.transform = 'translateY(0)'; // move all the boxes down to 0 y position
    
  }
  
  var over = setTimeout(reset, 4000 );
}


function reset(){
  
  console.log('SPINNING IS OVER??!?');

  init(false);
  
  // enable button again
  var playButton = document.getElementById("spinner");
  playButton.disabled = false;
  playButton.classList.remove('disabled');
  playButton.classList.add('enabled');
  playButton.addEventListener('click', spin);
}

function shuffleNew(theArray){
  for (var a = 0; a < theArray.length; a++) {
    var x = theArray[a];
    var y = Math.floor(Math.random() * (a + 1));
    theArray[a] = theArray[y];
    theArray[y] = x;
  }
  return theArray;
}
